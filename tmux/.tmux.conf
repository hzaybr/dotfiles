# Prefix: Ctrl-a (Ctrl-a twice jumps to the last window, a sends a literal ^A)
unbind C-b
set -g prefix C-a
bind C-a last-window
bind a send-prefix

# New windows and splits open in the current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes like vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vi-style controls for copy mode
setw -g mode-keys vi

# Everything else uses tmux defaults: n/p/0-9 windows, w/s pickers, d detach,
# , rename, & kill window, x kill pane, z zoom, [ copy mode, C-arrows resize.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ',xterm*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g history-limit 10000
set -g display-time 3000
set-option -g renumber-windows on
# Status bar content and colors come from nord-tmux below.
set -g status-left-length 55
set -g status-right-length 55

#source .bashrc
# set-option -g default-shell $SHELL
# set-option -g default-command "reattach-to-user-namespace -l zsh"
set -g default-shell /bin/zsh

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# theme
# set -g @plugin 'jimeh/tmux-themepack'
# set -g @themepack 'powerline/block/green'
set -g @plugin "arcticicestudio/nord-tmux"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
# run-shell "~/.tmux/themes/nord-tmux/nord.tmux"

