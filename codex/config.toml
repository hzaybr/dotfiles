# Codex CLI configuration
# MCP servers are appended by install.sh from claude/mcp-servers.json.
# Runtime state (project trust, [notice.*], [tui.model_availability_nux] NUX
# counters) is intentionally NOT tracked here: Codex writes it into
# ~/.codex/config.toml at runtime and it is machine-specific (absolute paths,
# per-host counters), so it is not portable.
model = "gpt-5.5"
network_access = true
personality = "pragmatic"
model_reasoning_effort = "xhigh"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "pull-request-number", "branch-changes", "context-remaining"]
status_line_use_colors = true
